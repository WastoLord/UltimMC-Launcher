name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        arch: 'win64_mingw81'

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "MinGW Makefiles"

    - name: Build
      run: |
        cd build
        mingw32-make -j2

    - name: Deploy Qt
      run: |
        cd build
        windeployqt *.exe

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: UltimMC-Windows
        path: build/*.exe
