name: Build Windows (Simple)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        arch: 'win64_mingw81'

    - name: Configure
      shell: pwsh
      run: |
        mkdir build
        cd build
        cmake .. `
          -G "MinGW Makefiles" `
          -DCMAKE_BUILD_TYPE=Release `
          -DLauncher_LAYOUT=win-bundle `
          -DLauncher_BUILD_PLATFORM=win64


    - name: Build
      shell: pwsh
      run: |
        cd build
        mingw32-make -j2

    - name: Deploy Qt
      run: |
        cd build
        windeployqt *.exe

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: UltimMC-Windows
        path: build/
