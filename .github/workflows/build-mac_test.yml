          make install 2>&1 | tee ../install_output.log || (echo "install failed" && exit 1)
          chmod +x /Users/runner/work/UltimMC/build/dist/UltimMC.app/Contents/MacOS/UltimMC || true

      - name: Upload build artifacts and logs
        uses: actions/upload-artifact@v3
        with:
          name: mac-build-output-arm64
          path: |
            cmake_output.log
            cmake_cache_and_vars.txt
            build_output.log
            test_output.log
            install_output.log
            /Users/runner/work/UltimMC/build/dist
